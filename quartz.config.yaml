# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: إدارة المشاريع البرمجية
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # معطّلة عمدًا — التفعيل يرسل بيانات الزوّار إلى طرف ثالث
  analytics: null
  # ar-SA يضبط <html lang="ar" dir="rtl"> ويعرّب واجهة الموقع كلها
  locale: ar-SA
  baseUrl: mohammedfattay.github.io/Project_Management_Notes
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .claude
    # القوالب وحدها — لا كل ما يبدأ بشرطة سفلية، فمنه محتوى حقيقي
    - "**/_*Template*"
    - "**/_Topic Template"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # خطوط عربية — الخطوط الافتراضية (Schibsted/Source Sans) بلا حروف عربية أصلًا
    typography:
      header: Tajawal
      body: IBM Plex Sans Arabic
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      # معطّل عمدًا: يَسِم صفحات المجلدات والوسوم و.base بـ broken وهي موجودة،
      # فيظهر 453 رابطًا سليمًا باهتًا (opacity 0.5). يُفعَّل مؤقّتًا للتشخيص فقط.
      disableBrokenWikilinks: false
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    # هذه الإضافة لا تقرأ configuration.theme.typography، بل لها خياراتها الخاصة
    # وترجع إلى خطوط Quartz الافتراضية (بلا حروف عربية) إن تُركت فارغة.
    options:
      header: Tajawal
      body: IBM Plex Sans Arabic
      code: IBM Plex Mono
      interface: IBM Plex Sans Arabic
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  # النسخة المستعملة محلّية ومرقَّعة: plugins/graph (وعلّتها في PATCHES.md هناك).
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        depth: 1
        # العمق 2 يبلغ ٧٠٠ عقدة في هذا المستودع لأنّ فيه فهارس تربط المئات،
        # فيصير المخطّط كتلة واحدة لا خريطة. والعمق 1 وسيطه ٢١ جارًا للصفحة.
        scale: 1.05
        # التنافر والمسافة أوسع من الافتراضي، وإلا تكدّست عشرون عقدة في بقعة.
        repelForce: 0.7
        centerForce: 0.3
        linkDistance: 38
        fontSize: 0.6
        opacityScale: 1
        showTags: true
        # وسم على ٧٥٢ صفحة من ٨٩٨ لا يفرّق شيئًا عن شيء، ويصير في المخطّط
        # الشامل عقدةً تتّصل بكلّ شيء فتُخفي البنية الحقيقية.
        removeTags:
          - إدارة-المشاريع
        # يُعتِم ما لا صلة له بالعقدة التي تحتها المؤشّر — وبه وحده يُقرأ
        # مخطّطٌ فيه ستّون عقدة.
        focusOnHover: true
        enableRadial: false
      globalGraph:
        depth: -1
        scale: 0.9
        repelForce: 0.5
        centerForce: 0.2
        linkDistance: 30
        fontSize: 0.6
        opacityScale: 1
        showTags: true
        removeTags:
          - إدارة-المشاريع
        focusOnHover: true
        enableRadial: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  # معطّلة: الحزمة غير منشورة على npm («Skipping … not found»)، فكانت تُنذر
  # في كل بناء بلا فائدة. ولا رسوم Excalidraw في هذا المستودع أصلًا.
  # لتفعيلها يومًا: تأكّد أولًا من أن @quartz-community/obsidian-plugin-excalidraw صار منشورًا.
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
